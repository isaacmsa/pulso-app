<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Pulso, ícono monocromático</title>
  <!--
    assets/android-icon-monochrome.png: ícono temático de Android 13+. Un solo color sobre
    transparencia (el sistema lo tiñe); misma escala que la capa delantera.
  -->
  <defs>
    <filter id="mono"><feFlood flood-color="#FFFFFF"/><feComposite in2="SourceAlpha" operator="in"/></filter>
  </defs>
  <image href="pulso-mark.svg" x="163.84" y="163.84" width="696.32" height="696.32" filter="url(#mono)"/>
</svg>
