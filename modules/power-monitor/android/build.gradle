plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.powermonitor'
version = '0.1.0'

android {
  namespace "expo.modules.powermonitor"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // el org.json de android.jar es un stub en los tests de JVM
  testImplementation 'org.json:json:20240303'
}
